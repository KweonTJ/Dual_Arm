# Metres unless a key ends in _mm. ROBOTIS FP04 dimensions are from PDFs (2010 revisions).
# Geometry/part associations are simplified and photo-inferred, not vendor CAD.
# Source index: https://www.robotis.com/service/downloadpage.php?ca_id=7040
premium_torso:
  # F51 (PDF no.377) rear/top + F52 (PDF no.381) front/bottom.
  # Official drawings, 07/06/2010; identified against 20261121 photos.
  width_mm: 90         # Y: twice the dimensioned 45 mm half-width.
  height_mm: 66        # Z: twice the dimensioned 33 mm half-height.
  depth_mm: 44         # X: F51 overall flange depth.
  wall_mm: 3          # F52 section; simplified uniform webs on both parts.
  f52_flange_depth_mm: 42.45
  mass_kg: 0.060       # UNMEASURED assembly estimate, not manufacturer data.
  shoulder_gap_mm: 2   # Photo-inferred clearance / attachment neck.
  shaft_below_top_mm: 14 # Photo-inferred mounting; case top is shaft +12 mm.
  # Aperture outlines, ribs and side mounting brackets are simplified.
approximation:
  side_wall: 0.003       # Not explicitly dimensioned on F2/F4 drawing.
  back_wall: 0.002       # Assumption: do not label as manufacturer tolerance.
FP04-F2:
  pdf_download_no: 325
  inner_width: 0.042
  axis_to_outer_back: 0.026
  back_width: 0.025     # Twice the labelled 12.5 mm centre-to-edge distance.
  axis_to_tip: 0.011    # Undimensioned outline approximation.
  side_hole_rows: [-0.016] # 26 - 10 mm.
  horn_pcd: 0.016
  horn_hole_diameter: 0.0021
  centre_hole_diameter: 0.008
FP04-F4:
  pdf_download_no: 333
  inner_width: 0.042
  axis_to_inner_back: 0.052
  axis_to_outer_back: 0.054 # 52 mm + assumed 2 mm back wall.
  total_length: 0.0647
  axis_to_tip: 0.0107      # 64.7 - 54 mm, depends on wall assumption.
  back_width: 0.029       # Twice labelled 14.5 mm centre-to-edge.
  side_hole_rows: [-0.016, -0.032]
  horn_pcd: 0.016
FP04-F5:
